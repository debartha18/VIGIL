version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbital_intel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OFFLINE_MODE=true
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./models.yaml:/app/models.yaml
    command: python -m uvicorn backend.api.server:app --host 0.0.0.0 --port 8000

  frontend:
    image: node:20-alpine
    container_name: orbital_intel_frontend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
